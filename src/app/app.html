@if (quotaExceeded()) {
  <div class="bg-amber-50 border-b border-amber-200 text-amber-900 px-4 py-2.5 text-xs md:text-sm text-center sticky top-0 z-50 shadow-sm">
    <span>
      Google Maps Platform quota reached. If you are the app owner, visit
      <a
        href="https://developers.google.com/maps/ai/ai-studio?utm_campaign=gmp_mcp_codeassist_v1_aistudio#quota_exceeded_errors"
        target="_blank"
        rel="noopener noreferrer"
        class="underline font-semibold text-amber-950 hover:text-amber-800"
      >
        maps developer site
      </a>
      for instructions to update your account.
    </span>
  </div>
}
<div class="min-h-screen flex flex-col bg-white text-slate-900">
  <app-site-header />
  <div class="flex-1">
    <router-outlet />
  </div>
  <app-site-footer />
  <app-hospital-assistant />
</div>
